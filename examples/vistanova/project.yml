# XcodeGen spec for the "double-click, Run" variant of VistaNova.
#
#   brew install xcodegen && xcodegen generate      # regenerates VistaNova.xcodeproj
#
# Same shape as locallm/examples/repo-qa-local/model-switch project.yml: ad-hoc signed, no
# sandbox, for local dev. No entitlements and no OAuth URL scheme needed — Tavily connects via a
# static API key (.pat), and every model here (Apple on-device + downloadable MLX) runs with no
# cloud auth at all, so nothing here is TCC-gated or OAuth-gated.
name: VistaNova
options:
  bundleIdPrefix: lab.locallm.vistanova
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
schemes:
  VistaNova:
    build:
      targets:
        VistaNova: all
    run:
      config: Debug
packages:
  VistaNovaPackage:
    path: .
targets:
  VistaNova:
    type: application
    platform: macOS
    sources:
      - path: Sources/VistaNova
    info:
      path: xcodeproj/VistaNova-Info.plist
      properties:
        CFBundleDisplayName: VistaNova
        CFBundleName: VistaNova
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "27.0"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.locallm.vistanova.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    dependencies:
      - package: VistaNovaPackage
        product: LocalLMLabSDKCore
      - package: VistaNovaPackage
        product: LocalLMLabSDKInference
