# XcodeGen spec for the "double-click, Run" variant of Plate Today.
#
#   brew install xcodegen && xcodegen generate      # regenerates PlateToday.xcodeproj
#
# The generated PlateToday.xcodeproj IS committed — a fresh clone opens it and Runs. Edit
# project.yml, not the .xcodeproj, then regenerate. packaging/build-and-sign.sh remains the way
# to make a distributable / MAS .app.
#
# Feature set baked into this variant: Todoist ON (the default), Contacts and Location/Weather
# OFF — matches `swift build` with no env vars. Flip them by adding to
# SWIFT_ACTIVE_COMPILATION_CONDITIONS below (and, for Contacts/Location, the matching
# usage-description key + entitlement).
#
# Signing: ad-hoc by default (CODE_SIGN_IDENTITY "-"), same local tier as
# packaging/build-and-sign.sh with APP_IDENTITY unset. Calendar/Reminders TCC prompts can be
# unreliable under an ad-hoc signature — for a dependable prompt, open the project's target ▸
# Signing & Capabilities and pick your team ("Sign to Run Locally" / a free personal team is
# enough); that does not need a paid account.
name: PlateToday
options:
  bundleIdPrefix: lab.locallm.sdk.reference
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
schemes:
  PlateToday:
    build:
      targets:
        PlateToday: all
    run:
      config: Debug
packages:
  PlateTodayPackage:
    path: .
targets:
  PlateToday:
    type: application
    platform: macOS
    sources:
      - path: Sources/PlateToday
    info:
      path: xcodeproj/PlateToday-Info.plist
      properties:
        CFBundleDisplayName: Plate Today
        CFBundleName: Plate Today
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: true
        NSCalendarsFullAccessUsageDescription: Plate Today reads your calendar events for today to summarize what's on your plate.
        NSRemindersFullAccessUsageDescription: Plate Today reads your reminders due today to summarize what's on your plate.
        CFBundleURLTypes:
          - CFBundleURLName: lab.locallm.sdk.reference.platetoday.oauth
            CFBundleURLSchemes: [platetoday]
    # XcodeGen owns (regenerates) this file from `properties` — keep it separate from
    # packaging/PlateToday.entitlements, which build-and-sign.sh owns. Calendars covers
    # Reminders too (both go through EventKit); no separate reminders entitlement exists.
    entitlements:
      path: xcodeproj/PlateToday.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.locallm.sdk.reference.platetoday
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: PLATETODAY_INCLUDE_TODOIST
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    dependencies:
      - package: PlateTodayPackage
        product: LocalLMLabSDKCore
